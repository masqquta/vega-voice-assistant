# Fly.io: HTTPS из коробки, volume под SQLite, без засыпания (холодный старт не должен сорвать демо, NFR-9).
# Перед первым деплоем: fly launch --no-deploy --copy-config; fly volumes create data --size 1 --region ams
app = "vega-assistant"
primary_region = "ams"

[build]

[env]
  NODE_ENV = "production"
  PORT = "3000"
  DB_PATH = "/data/app.db"
  TZ_DEFAULT = "Europe/Moscow"

[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/v1/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
